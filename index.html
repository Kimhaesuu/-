<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COCORORIA HTML 편집기</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div>
    <h1>COCORORIA HTML 편집기</h1>
    <p>원본 이미지를 유지하면서 채팅을 직접 수정·삭제·추가할 수 있습니다.</p>
  </div>
  <div class="top-actions">
    <label class="btn">HTML 열기<input id="file" type="file" accept=".html,.htm"></label>
    <input id="filename" class="filename" value="cocororia_edited.html" aria-label="저장 파일명">
    <button id="download" class="btn primary" disabled>HTML 저장</button>
  </div>
</header>

<main class="layout">
  <aside class="side">
    <section class="panel">
      <div class="panel-title">탭 / 채널</div>
      <div class="hint">탭을 나누어 표시하지 않습니다. 각 탭의 메시지 배경색만 바꿀 수 있고, <b>전체 삭제</b>로 그 탭의 채팅을 한꺼번에 제거합니다.</div>
      <div id="tabs"></div>
    </section>

    <section class="panel">
      <div class="panel-title">캐릭터</div>
      <div id="chars"></div>
    </section>

    <section class="panel">
      <div class="panel-title">메시지</div>
      <button id="addMessage" class="wide" disabled>＋ 메시지 추가</button>
      <div class="hint">채팅 내용은 화면에서 바로 클릭해 수정할 수 있습니다. 각 메시지의 휴지통 버튼으로 개별 삭제할 수 있습니다.</div>
    </section>
  </aside>

  <section class="workspace">
    <div id="empty" class="empty">COCORORIA HTML을 먼저 열어주세요.</div>
    <div id="chat" class="chat" hidden></div>
  </section>
</main>

<dialog id="addDialog">
  <form method="dialog" id="addForm" class="dialog">
    <h2>메시지 추가</h2>
    <label>탭
      <select id="addChannel"></select>
    </label>
    <label>캐릭터
      <select id="addSpeaker"></select>
    </label>
    <label class="check"><input id="addSystem" type="checkbox"> /system 메시지</label>
    <label>내용<textarea id="addText" rows="5" required></textarea></label>
    <div class="dialog-actions">
      <button value="cancel" class="btn">취소</button>
      <button value="default" class="btn primary">추가</button>
    </div>
  </form>
</dialog>

<script src="script.js"></script>
</body>
</html>
